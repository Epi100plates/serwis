name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do wydania (puste = tag z ref)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build + ZIP + GitHub Release
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TAG: ${{ inputs.tag }}
      REF_NAME: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Pakowanie i sumy
        shell: pwsh
        run: |
          $tag = $env:INPUT_TAG
          if (-not $tag) { $tag = $env:REF_NAME }
          $ver = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/serwiskit.exe dist
          Copy-Item LICENSE, README.md dist
          $zipName = "serwiskit-$ver-windows-x64.zip"
          Compress-Archive -Path dist/serwiskit.exe, dist/LICENSE, dist/README.md -DestinationPath "dist/$zipName"
          $sums = foreach ($n in @($zipName, 'serwiskit.exe')) {
            "$((Get-FileHash "dist/$n" -Algorithm SHA256).Hash.ToLower())  $n"
          }
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($sums -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: GitHub Release
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $extra = @()
            if ($env:VER.StartsWith('0.')) { $extra += '--prerelease' }
            gh release create $env:TAG --title "SerwisKit $env:VER" --notes-file CHANGELOG.md --verify-tag @extra
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $env:TAG "dist/serwiskit-$env:VER-windows-x64.zip" dist/SHA256SUMS.txt dist/serwiskit.exe --clobber

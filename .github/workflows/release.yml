name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do wydania (puste = tag z ref)'
        required: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Build + ZIP + GitHub Release
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Trzy drogi: tag `v*`, push na `main` (publikuje, gdy brakuje wydania dla wersji
      # z Cargo.toml — tak naprawia się wydanie bez ruszania tagu, bo GitHub usuwa
      # wydanie przy każdej zmianie refu tagu) i ręczne uruchomienie.
      - name: Który tag i czy publikować
        id: decide
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = ''
          if ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG
          } elseif ($env:REF_NAME -like 'v*') {
            $tag = $env:REF_NAME
          } else {
            $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            $tag = 'v' + $line.Matches[0].Groups[1].Value
          }
          if (-not (git rev-parse -q --verify "refs/tags/$tag")) {
            Write-Output "Tag $tag nie istnieje - nie ma czego wydawac"
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $json | ConvertFrom-Json
            Write-Output "Wydanie ${tag}: draft=$($release.draft) prerelease=$($release.prerelease) assets=$($release.assets.Count) url=$($release.html_url)"
            if (-not $release.draft) {
              Write-Output "Wydanie $tag jest opublikowane - nic do zrobienia"
              "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
            }
            Write-Output "Wydanie $tag jest szkicem - publikuje je"
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Output "Wydanie $tag brakuje - publikuje z commita $(git rev-parse --short "$tag^{commit}")"
          }
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Na pushu do main budujemy z commita tagu, nie z HEAD - inaczej artefakt nie
      # odpowiada wydaniu.
      - name: Checkout commita tagu
        if: steps.decide.outputs.publish == 'true' && github.ref_type != 'tag'
        run: git checkout ${{ steps.decide.outputs.tag }}

      - name: Toolchain
        if: steps.decide.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache
        if: steps.decide.outputs.publish == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build release
        if: steps.decide.outputs.publish == 'true'
        run: cargo build --release

      - name: Pakowanie i sumy
        if: steps.decide.outputs.publish == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/serwiskit.exe dist
          Copy-Item LICENSE, README.md dist
          $zipName = "serwiskit-$ver-windows-x64.zip"
          Compress-Archive -Path dist/serwiskit.exe, dist/LICENSE, dist/README.md -DestinationPath "dist/$zipName"
          $sums = foreach ($n in @($zipName, 'serwiskit.exe')) {
            "$((Get-FileHash "dist/$n" -Algorithm SHA256).Hash.ToLower())  $n"
          }
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($sums -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: GitHub Release
        if: steps.decide.outputs.publish == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $extra = @()
            if ($env:VER.StartsWith('0.')) { $extra += '--prerelease' }
            gh release create $env:TAG --title "SerwisKit $env:VER" --notes-file CHANGELOG.md --verify-tag @extra
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $env:TAG "dist/serwiskit-$env:VER-windows-x64.zip" dist/SHA256SUMS.txt dist/serwiskit.exe --clobber

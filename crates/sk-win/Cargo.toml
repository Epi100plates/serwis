[package]
name = "sk-win"
description = "Warstwa Windows SerwisKit: WMI, zegar, środowisko procesu (jedyne miejsce z unsafe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sk-core = { path = "../sk-core" }
serde_json.workspace = true
tracing.workspace = true
wmi.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

# Wyjątek od reguły repozytorium: całe FFI żyje w tym crate, więc `unsafe_code`
# jest tu dozwolone. Pozostałe linty jak w workspace (Cargo nie pozwala łączyć
# `workspace = true` z nadpisaniem, stąd jawna lista).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
